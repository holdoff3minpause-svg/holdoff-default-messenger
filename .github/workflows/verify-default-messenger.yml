name: Verify HoldOff Default Messenger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew -p android-app :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: holdoff-default-messenger-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
